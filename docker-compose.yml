name: health-insurance-analytics

services:

  db:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: health_insurance
      MYSQL_USER: healthuser
      MYSQL_PASSWORD: healthpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    depends_on:
      - db

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    depends_on:
      - backend

    ports:
      - "80:80"

    restart: unless-stopped

volumes:
  mysql_data:
